<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>销售支持中心</title>
  <style>
    :root{--bg:#f5f2ed;--paper:#fffdfa;--panel:#fff;--ink:#2a2824;--muted:#7b756d;--line:#e8e1d7;--orange:#e88935;--orange-soft:#fff4e7;--green:#315b4d;--green-soft:#edf5f1;--shadow:0 18px 44px rgba(53,46,37,.08)}
    *{box-sizing:border-box}html,body{margin:0}body{background:radial-gradient(circle at top right,#fff4e6 0,transparent 28%),var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 28px));margin:auto;padding:28px 0 72px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:26px;align-items:center;padding:34px 0 20px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--paper);border:1px solid #efd5bb;color:#ad6226;font-size:12px;font-weight:900;letter-spacing:.08em}
    .hero h1{margin:16px 0 10px;font-size:clamp(34px,5.5vw,54px);line-height:1.06;letter-spacing:-.04em}.hero p{max-width:630px;margin:0;color:var(--muted);font-size:16px;line-height:1.75}
    .quick-asks{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.quick-asks a{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(53,46,37,.04);font-size:13px;font-weight:700;color:#4e4a44}
    .hero-visual{position:relative;min-height:320px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#fffdfa,#fff7ee);box-shadow:var(--shadow);overflow:hidden}.hero-visual:before{content:"";position:absolute;inset:auto -24px -32px auto;width:180px;height:180px;border-radius:50%;background:rgba(232,137,53,.11)}.hero-visual img{width:100%;height:100%;object-fit:cover;display:block}
    .hero-note{position:absolute;right:20px;bottom:18px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.92);border:1px solid #efe3d6;box-shadow:0 12px 24px rgba(53,46,37,.08);max-width:260px}.hero-note b{display:block;font-size:14px}.hero-note span{display:block;margin-top:4px;font-size:12px;line-height:1.65;color:var(--muted)}
    .switches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.switch{padding:14px 16px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.78)}.switch b{display:block;font-size:15px}.switch span{display:block;margin-top:4px;font-size:13px;color:var(--muted);line-height:1.6}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:38px 0 16px}.section-title h2{margin:0;font-size:28px}.section-title p{margin:0;color:var(--muted);max-width:520px;line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.card{position:relative;display:flex;flex-direction:column;min-height:290px;border:1px solid var(--line);border-radius:28px;background:var(--panel);padding:26px;box-shadow:0 8px 24px rgba(53,46,37,.04);transition:transform .18s,border-color .18s,box-shadow .18s;overflow:hidden}.card:hover{transform:translateY(-4px);border-color:#d8c7b7;box-shadow:0 18px 36px rgba(53,46,37,.09)}
    .card:before{content:"";position:absolute;top:-40px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(232,137,53,.08)}.card.green:before{background:rgba(49,91,77,.08)}.card.training:before{background:rgba(86,131,215,.08)}.badge{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--orange-soft);color:#c36d20;font-weight:900}.green .badge{background:var(--green-soft);color:var(--green)}.training .badge{background:#eff3ff;color:#557fd3}.card h3{margin:22px 0 10px;font-size:24px;line-height:1.25}.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chips span{padding:6px 10px;border-radius:999px;background:#f5f2ee;color:#676159;font-size:12px}.card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:22px;font-weight:800;font-size:14px}.arrow{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#f8f3ed;color:var(--orange);font-size:18px}
    .mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.mini{padding:16px;border-radius:18px;background:#fff;border:1px solid var(--line)}.mini b{display:block;font-size:14px}.mini span{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.65}
    .hint{margin-top:20px;border-radius:18px;background:linear-gradient(145deg,#f0efec,#f8f6f2);padding:16px 18px;color:var(--muted);font-size:13px;line-height:1.7;border:1px solid #ebe5dd}
    .compact-head{display:flex;align-items:center;justify-content:space-between;gap:24px;margin:28px 0 24px;padding:26px 32px;border:1px solid var(--line);border-radius:28px;background:#fffdfa;overflow:hidden}.compact-head h1{font-size:clamp(30px,4vw,42px);margin:12px 0 6px}.compact-head p{margin:0;color:var(--muted);font-size:14px}.compact-head img{width:180px;height:130px;object-fit:cover;border-radius:20px}.card{min-height:216px}.card h3{margin-top:20px}.grid{gap:14px}@media(max-width:600px){.compact-head{margin:20px 0;padding:22px}.compact-head img{width:92px;height:92px}.card{min-height:190px;padding:22px}}
    @media(max-width:900px){.hero{grid-template-columns:1fr}.switches,.mini-grid,.grid{grid-template-columns:1fr}.wrap{width:min(100% - 22px,720px)}.hero-visual{min-height:260px}.section-title{display:block}.section-title p{margin-top:8px}}
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="/">← 返回猫咪合作平台</a>
    <header class="compact-head"><div><span class="eyebrow">SALES SUPPORT</span><h1>销售支持中心</h1><p>选一个现在用得上的工具。</p></div><img src="/ui-assets/manual-hero-cat.svg" alt="" aria-hidden="true"></header>
    <section class="grid" aria-label="销售工具">
      <a class="card" href="/guide/"><span class="badge">01</span><h3>基础与成交手册</h3><p>合作规则、报价、客户沟通与成交事项。</p><div class="foot"><span>查看手册</span><span class="arrow">→</span></div></a>
      <a class="card green" href="/guide-sales/"><span class="badge">02</span><h3>销路实操手册</h3><p>发布内容、寻找需求与合作渠道。</p><div class="foot"><span>查看手册</span><span class="arrow">→</span></div></a>
      <a class="card training" href="/training/"><span class="badge">练</span><h3>模拟实战</h3><p>跟着一位模拟客户练习选猫、报价与答疑。</p><div class="foot"><span>开始练习</span><span class="arrow">→</span></div></a>
      <a class="card green" href="/assistant/"><span class="badge">AI</span><h3>AI 销售助手</h3><p>粘贴客户消息，生成可检查、可复制的回复。</p><div class="foot"><span>打开助手</span><span class="arrow">→</span></div></a>
    </section>
  </main>
</body>
</html>
