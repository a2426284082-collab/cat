label="新对话"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button><button class="mobile-action" aria-label="历史会话"><svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-history"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg></button><button class="mobile-action" aria-label="退出登录"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg></button></div></header><div class="chat-scroll"><section class="welcome"><div class="welcome-symbol"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path><path d="M5 3v4"></path><path d="M19 17v4"></path><path d="M3 5h4"></path><path d="M17 19h4"></path></svg></div><div class="eyebrow">你的 AI 销售搭档</div><h1>这位客户，我们一起聊。</h1><p>粘贴客户的消息，把难回答的话，变成自然的沟通。</p><div class="scenario-heading"><span>不知道怎么开口？从这里开始</span><span>点击带入 <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></span></div><div class="scenario-grid"><button class="scenario-card"><div><span class="scenario-number">01</span><span class="scenario-category">价格沟通</span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></div><strong>客户觉得价格高</strong><p>“<!-- -->这只为什么比别人贵？<!-- -->”</p></button><button class="scenario-card"><div><span class="scenario-number">02</span><span class="scenario-category">建立信任</span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></div><strong>想确认猫咪健康</strong><p>“<!-- -->能保证没有猫癣吗？<!-- -->”</p></button><button class="scenario-card"><div><span class="scenario-number">03</span><span class="scenario-category">消除顾虑</span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></div><strong>担心运输不安全</strong><p>“<!-- -->运输安全吗？<!-- -->”</p></button><button class="scenario-card"><div><span class="scenario-number">04</span><span class="scenario-category">售后解答</span><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up-right"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></div><strong>询问定金和售后</strong><p>“<!-- -->定金能退吗？<!-- -->”</p></button></div></section></div><div class="composer-area"><form class="composer"><div class="composer-context"><span><span class="tiny-dot"></span>客户说了什么？</span><button type="button" aria-expanded="false" aria-controls="reply-settings">亲切自然<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=""><path d="m6 9 6 6 6-6"></path></svg></button></div><textarea aria-label="客户消息" maxLength="5000" rows="3" placeholder="粘贴客户原话，或补充你想咨询的问题…"></textarea><div class="composer-toolbar"><span><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-message-square"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg><span class="desktop-hint">支持连续追问</span><span class="character-count">0<!-- --> / 5000</span></span><button class="send-button" type="submit" disabled=""><span>生成回复</span><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-arrow-up"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button></div></form><div class="composer-footnote"><span><svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg> 发送前，请核对猫咪资料与承诺内容</span><span class="desktop-hint">Ctrl / ⌘ + Enter 发送</span></div></div></main></div><div class="preview-notice">静态设计预览 · 示例姓名与额度 · 实际功能请运行压缩包内的网站</div><script>document.querySelectorAll('button').forEach(b=>b.addEventListener('click',e=>e.preventDefault()));document.querySelectorAll('a').forEach(a=>a.removeAttribute('href'));document.querySelectorAll('form').forEach(f=>f.addEventListener('submit',e=>e.preventDefault()));</script></body></html>
