<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>第一次成交 · 实战带练</title><style>
:root{--ink:#252522;--muted:#77736c;--line:#e7e2da;--bg:#f4f3ef;--green:#1f8f55;--chat:#95ec69;--orange:#e88935}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100% - 1180px)/2));position:sticky;top:0;z-index:10}.back{color:var(--muted);text-decoration:none;font-size:14px}.progress{display:flex;gap:5px}.progress i{width:24px;height:4px;border-radius:9px;background:#ddd}.progress i.on{background:var(--orange)}.layout{width:min(1180px,calc(100% - 28px));margin:24px auto 60px;display:grid;grid-template-columns:390px 1fr;gap:24px;align-items:start}.phone{border:7px solid #222;border-radius:36px;background:#ededed;box-shadow:0 18px 50px #39312520;overflow:hidden;min-height:720px;position:sticky;top:84px}.phonebar{height:52px;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:13px}.phonebar strong{font-size:15px}.chat{padding:18px 13px 28px;min-height:606px;max-height:606px;overflow:auto}.time{text-align:center;color:#aaa;font-size:11px;margin:3px 0 17px}.msg{display:flex;align-items:flex-start;gap:8px;margin:14px 0}.msg.me{flex-direction:row-reverse}.avatar{width:38px;height:38px;border-radius:6px;display:grid;place-items:center;background:#fff;font-size:22px;flex:none}.bubble{max-width:76%;padding:10px 12px;border-radius:5px;background:#fff;font-size:14px;line-height:1.55;box-shadow:0 1px 1px #0000000b}.me .bubble{background:var(--chat)}.chat-input{height:55px;background:#f7f7f7;border-top:1px solid #ddd;display:flex;align-items:center;gap:8px;padding:8px}.chat-input span{flex:1;height:38px;border-radius:5px;background:#fff}.panel{border:1px solid var(--line);border-radius:24px;background:#fff;padding:30px;box-shadow:0 8px 30px #4d433618;min-height:650px}.eyebrow{color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.12em}.panel h1{font-size:28px;margin:10px 0}.lead{color:var(--muted);line-height:1.8;margin:0 0 22px}.notice{background:#fff7e9;border:1px solid #f3d4aa;border-radius:15px;padding:14px 16px;font-size:13px;line-height:1.65}.actions{display:grid;gap:10px;margin-top:22px}.primary,.choice{border:0;border-radius:13px;padding:14px 17px;text-align:left}.primary{background:#252522;color:#fff;font-weight:800;text-align:center}.primary:disabled{opacity:.35;cursor:not-allowed}.choice{background:#f5f3ef;border:1px solid transparent}.choice:hover{border-color:#e3a65d;background:#fff8ef}.choice b{display:block;margin-bottom:4px}.choice small,.tiny{color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{border:1px solid var(--line);border-radius:13px;padding:12px}.field small{display:block;color:var(--muted);margin-bottom:5px}.mock-filter{background:#f8f7f4;border-radius:16px;padding:14px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:12px}.chip.on{background:#edf6f1;color:#246044;border-color:#c7dfd2}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cat{border:2px solid transparent;border-radius:14px;background:#fff;overflow:hidden;padding:0;text-align:left}.cat.selected{border-color:var(--green)}.catpic{height:94px;display:grid;place-items:center;font-size:54px;background:linear-gradient(145deg,#f3e7d4,#e5dacb)}.cat:nth-child(2) .catpic{background:linear-gradient(145deg,#e7edf5,#d8e0ea)}.cat:nth-child(3) .catpic{background:linear-gradient(145deg,#f5e3e3,#e8d4d2)}.catinfo{padding:9px;font-size:12px;line-height:1.5}.catinfo b{display:block}.price-row{display:grid;grid-template-columns:1fr 105px 90px;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.price-row input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px}.material{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:75px 1fr;gap:13px;margin:9px 0}.photo{display:grid;place-items:center;background:#eee1d0;border-radius:10px;font-size:42px}.material p{font-size:12px;line-height:1.7;margin:4px 0;color:var(--muted)}.branch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.branch button{border:1px solid var(--line);border-radius:14px;background:#fff;padding:16px 10px}.branch button:hover{border-color:#d99b54}.branch span{display:block;font-size:24px;margin-bottom:8px}.done{text-align:center;padding:28px}.seal{margin:auto;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#eaf6ef;color:var(--green);font-size:34px}@media(max-width:820px){.layout{grid-template-columns:1fr}.phone{position:relative;top:0;min-height:600px;max-width:390px;margin:auto}.chat{min-height:490px;max-height:490px}.panel{min-height:0;padding:22px}.cats{grid-template-columns:repeat(2,1fr)}.branch{grid-template-columns:1fr}.top b{display:none}}
</style></head><body><header class="top"><a class="back" href="/manuals/">← 销售手册</a><b>第一次成交 · 模拟实战</b><div class="progress" id="progress"></div></header><main class="layout"><section class="phone"><div class="phonebar"><span>‹</span><strong>客户小林</strong><span>•••</span></div><div class="chat" id="chat"></div><div class="chat-input"><b>☺</b><span></span><b>＋</b></div></section><section class="panel" id="panel"></section></main><script>
const S={selected:[],messages:[]},cats=[['C-102','海双布偶妹妹','2个月','¥900'],['C-118','蓝双布偶妹妹','3个月','¥1050'],['C-126','海双布偶妹妹','2个月','¥1150'],['C-139','重点色布偶妹妹','3个月','¥980']];const chat=document.querySelector('#chat'),panel=document.querySelector('#panel'),progress=document.querySelector('#progress');
function bubbles(){chat.innerHTML='<div class="time">今天 14:28</div>'+S.messages.map(m=>`<div class="msg ${m.me?'me':''}"><span class="avatar">${m.me?'🐾':'👩'}</span><div class="bubble">${m.text}</div></div>`).join('');chat.scrollTop=chat.scrollHeight}function say(text,me=false){S.messages.push({text,me});bubbles()}function prog(n){progress.innerHTML=Array.from({length:6},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}function shell(k,t,l,b){panel.innerHTML=`<div class="eyebrow">${k}</div><h1>${t}</h1><p class="lead">${l}</p>${b}`}
function start(){prog(1);S.messages=[];S.selected=[];say('你好，想买一只布偶妹妹，最好两三个月，预算1500左右，可以发杭州吗？');shell('STEP 01 · 接住需求','先把客户要什么整理清楚','不要急着发一堆猫。先从客户原话里找出五个条件。',`<div class="fields"><div class="field"><small>品种</small><b>布偶猫</b></div><div class="field"><small>性别</small><b>母</b></div><div class="field"><small>年龄</small><b>2—3个月</b></div><div class="field"><small>预算</small><b>1500元左右</b></div><div class="field"><small>收货城市</small><b>杭州</b></div></div><div class="notice" style="margin-top:15px">真实接待时由你自己整理即可；复杂长消息可交给常用AI提取，不必在标准训练中消耗平台额度。</div><div class="actions"><button class="primary" onclick="filterStep()">需求清楚了，去筛猫 →</button></div>`)}
function filterStep(){prog(2);say('好的，我按你的预算和要求先筛几只比较合适的。',true);shell('STEP 02 · 猫源筛选','只选3—5只最接近的','筛选条件已经替你带入。现在亲手选择3只猫，选得太多会增加客户负担。',`<div class="mock-filter"><div class="chips"><span class="chip on">布偶猫</span><span class="chip on">母</span><span class="chip on">2—3个月</span><span class="chip">供货价≤1200</span></div><div class="cats">${cats.map((c,i)=>`<button class="cat" id="cat${i}" onclick="pick(${i})"><div class="catpic">🐱</div><div class="catinfo"><b>${c[1]}</b>${c[2]} · ${c[3]}<br>${c[0]}</div></button>`).join('')}</div></div><p class="tiny" id="count">已选择 0/3 只</p><button class="primary" id="picknext" disabled onclick="priceStep()">选好了，设置报价 →</button>`)}
function pick(i){const p=S.selected.indexOf(i);if(p>=0)S.selected.splice(p,1);else if(S.selected.length<3)S.selected.push(i);document.querySelector('#cat'+i).classList.toggle('selected',p<0&&S.selected.includes(i));document.querySelector('#count').textContent=`已选择 ${S.selected.length}/3 只`;document.querySelector('#picknext').disabled=S.selected.length!==3}
function priceStep(){prog(3);shell('STEP 03 · 报价与资料','客户只看最终报价','根据客户预算设置销售价，再把资料整理成可以直接发送的形式。',`<div>${S.selected.map((i,n)=>`<div class="price-row"><span><b>${cats[i][0]}</b><br>${cats[i][1]}</span><span>供货 ${cats[i][3]}</span><input value="${[1299,1399,1499][n]}"></div>`).join('')}</div><div class="notice" style="margin-top:14px">报价同时考虑客户预算、平台供货价和你的利润，不需要向客户解释成本或加价。</div><div class="actions"><button class="primary" onclick="materialStep()">生成客户资料 →</button></div>`)}
function materialStep(){prog(4);say('按你的要求先挑了3只布偶妹妹，年龄和预算都比较接近。你看看哪只更有眼缘，喜欢哪只我再帮你确认最新状态。',true);shell('STEP 04 · 发给客户','一次给出清楚、有限的选择','真实操作中可以复制文案、图片视频或展示页。',`${S.selected.map((i,n)=>`<div class="material"><div class="photo">🐱</div><div><b>${cats[i][1]} · ${[1299,1399,1499][n]}元</b><p>${cats[i][2]}，疫苗信息以成交前核对为准<br>编号：${cats[i][0]}</p></div></div>`).join('')}<div class="actions"><button class="primary" onclick="feedbackStep()">我已经发给客户 →</button></div>`)}
function feedbackStep(){prog(5);shell('STEP 05 · 处理反馈','所有回复最终都进入三条路','分别点开看看。真实接待时，根据客户反馈选择对应动作。',`<div class="branch"><button onclick="branch('no')"><span>↩️</span><b>不满意</b><small>重新调整条件筛选</small></button><button onclick="branch('ask')"><span>💬</span><b>有疑问</b><small>利用AI助手答疑</small></button><button onclick="branch('yes')"><span>✅</span><b>已选中</b><small>确认库存与条件</small></button></div><p class="tiny" style="margin-top:18px">建议先体验“不满意”和“有疑问”，最后选择“已选中”完成成交。</p>`)}
function branch(type){if(type==='no'){say('这几只都不太喜欢，能不能再便宜一点？');shell('反馈 A · 不满意','改变条件，重新筛选','先找出不满意的原因，再保留其余需求。',`<div class="notice">保留：布偶猫、妹妹、2—3个月、杭州<br>调整：报价预算降低</div><div class="actions"><button class="choice" onclick="filterStep()"><b>按新预算重新筛选</b><small>回到猫源库重新选择3—5只</small></button><button class="primary" onclick="feedbackStep()">返回体验其他反馈</button></div>`)}else if(type==='ask'){say('可以保证没有猫癣、到家一定健康吗？');shell('反馈 B · 有疑问','不会回答就交给AI助手','健康、运输、退款等高风险问题不要自行保证。训练用固定答案，不消耗额度。',`<div class="notice"><b>建议回复</b><br>活体不适合口头承诺“绝对不会出现问题”。我可以按猫咪编号核对目前的健康资料和最新状态，具体售后以成交前确认的书面约定为准。</div><div class="actions"><a class="primary" style="text-decoration:none" href="/assistant/">进入真实AI助手（计入额度）</a><button class="choice" onclick="feedbackStep()"><b>训练里先不消耗额度</b><small>返回继续体验成交分支</small></button></div>`)}else{say('我喜欢第二只，就要这只了，今天能买吗？');confirmStep()}}
function confirmStep(){prog(6);const c=cats[S.selected[1]??S.selected[0]??0];shell('反馈 C · 已选中','先确认，再成交','客户选中不等于立刻收钱。先向平台提交猫咪编号，确认库存和成交条件。',`<div class="fields"><div class="field"><small>意向猫咪</small><b>${c[0]}</b></div><div class="field"><small>客户城市</small><b>杭州</b></div><div class="field"><small>需要确认</small><b>库存、健康</b></div><div class="field"><small>同时确认</small><b>运输、价格、售后</b></div></div><div class="notice" style="margin-top:14px">未确认库存前不要先向客户保证，也不要急着收款。</div><div class="actions"><button class="primary" onclick="finish()">平台已确认，可以成交 →</button></div>`)}
function finish(){say('这只目前确认还在。我再和你核对一下猫咪编号、最终价格、运输和售后内容，确认没有问题后再进行下一步。',true);shell('COMPLETE','你已经走完第一条成交链路','以后重复使用：接需求、筛3—5只、报价发资料，再根据反馈重新筛选、AI答疑或确认成交。',`<div class="done"><div class="seal">✓</div><h2>第一次实战完成</h2><p class="lead">真正接待时不需要背流程，遇到哪一步就回来查看。</p></div><div class="actions"><button class="primary" onclick="start()">重新练习一次</button><a class="choice" href="/" style="text-decoration:none;text-align:center"><b>回到猫源大厅</b></a></div>`)}
prog(0);shell('SIMULATION · 约8分钟','跟着完成第一次接待','左边是一段模拟私聊。你会亲手走完从客户提出需求，到筛猫、报价、答疑和确认成交的全过程。',`<div class="notice">标准训练完全使用预设内容，不调用AI，也不消耗Token。只有主动进入真实AI助手时才计入额度。</div><div class="actions"><button class="primary" onclick="start()">开始模拟接待</button><a class="choice" href="/manuals/" style="text-decoration:none;text-align:center"><b>我暂时不需要带练</b></a></div>`);bubbles();
</script></body></html>
