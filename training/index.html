<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>新手实战带练 · 猫咪合作平台</title><link rel="stylesheet" href="/ui-assets/sales-learning.css"></head>
<body class="training-page"><header class="site-header"><div class="site-header-inner"><a href="/" class="site-brand"><span class="brand-tile"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#cat"/></svg></span><span>猫咪合作平台<small>SALES WORKSPACE</small></span></a><nav aria-label="主导航"><a href="/">猫源库</a><a href="/manuals/" >销售支持</a><a href="/training/" aria-current="page">新手带练</a><a href="/assistant/">AI 助手 <svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#arrow-up"/></svg></a></nav><a class="header-back" href="/manuals/"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#back"/></svg><span>支持中心</span></a></div></header>
<main class="training-main"><header class="training-heading"><div><span class="eyebrow">LEARN BY DOING</span><h1>第一次接待，我们陪你练。</h1><p>跟着客户小林，走完一条完整的成交流程。</p></div><div class="training-label"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#clock"/></svg> 约 8 分钟 <span>·</span> 模拟练习</div></header>
<div class="training-layout"><aside class="lesson-sidebar"><div class="lesson-summary"><span>本次练习进度</span><b id="lessonPercent">0%</b></div><div class="lesson-progress"><span id="lessonProgress"></span></div><nav class="lesson-steps" id="steps" aria-label="练习步骤"></nav><div class="lesson-sidebar-note"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#compass"/></svg><b>不用急，跟着做就好。</b><p>可以返回已走过的步骤，<br>也可以随时重新练习。</p></div><button class="restart-button" id="restart"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#reset"/></svg> 重新开始</button><small id="saveStatus" class="save-status">进度保存在当前浏览器</small></aside>
<section class="lesson-workspace" aria-label="练习操作区"><div id="panel" class="lesson-panel"></div></section>
<aside class="customer-panel" id="customerPanel"><button class="customer-heading" id="chatToggle" aria-expanded="false" aria-controls="customerBody"><span class="customer-avatar">林</span><span><b>客户小林</b><small><span class="status-dot"></span> 模拟对话 · 随练习更新</small></span><svg class="icon chat-chevron" aria-hidden="true"><use href="/ui-assets/sales-icons.svg#chevron"/></svg></button><div class="customer-body" id="customerBody"><div class="customer-context"><span>客户需求</span><p>布偶妹妹 · 2—3 个月<br><b id="customerBudget">预算约 ¥1,500</b> · 杭州</p></div><div class="practice-chat" id="chat" role="log" aria-label="模拟客户对话"></div><div class="chat-bottom"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#message"/></svg> 在左侧完成操作，这里会同步对话</div></div></aside>
</div><footer class="page-footer"><span>练习中的猫咪、价格和对话均为模拟资料。</span><span id="stepStatus" aria-live="polite">准备开始</span></footer></main>
<div class="toast" id="toast" role="status" hidden></div>
<dialog class="reset-dialog" id="resetDialog"><form method="dialog"><span class="dialog-icon"><svg class="icon " aria-hidden="true"><use href="/ui-assets/sales-icons.svg#reset"/></svg></span><h2>重新练习一次？</h2><p>本次模拟进度会清空，你可以从接住第一条客户消息重新开始。</p><div><button class="button secondary" value="cancel" autofocus>继续当前练习</button><button class="button primary" value="reset">重新开始</button></div></form></dialog>
<script type="module" src="./training.js"></script></body></html>
