
  <div class="training-main legacy-main">
    <header class="page-heading"><div><h1>新手带练</h1><p>一次一个小任务，暂停后可接着练。</p></div><button class="quiet-button" id="restart">↻ 重新练习</button></header>
    <div class="training-layout">
      <details class="lesson-sidebar" aria-label="练习路线"><summary class="training-route-toggle"><span>查看练习路线</span><strong id="lessonPercent">0%</strong></summary>
        <div class="progress-track"><span id="lessonProgress"></span></div>
        <nav id="steps" aria-label="练习步骤"></nav>
        <small id="saveStatus">进度保存在当前浏览器</small>
      </details>
      <section class="lesson-workspace" aria-label="带练操作区">
        <div class="workspace-top"><button class="icon-button" id="topBack" aria-label="返回上一步">‹</button><b id="phaseTitle">新手带练</b><span class="practice-badge">模拟</span></div>
        <div class="phase-track"><span id="phaseProgress"></span></div>
        <div id="panel"></div>
      </section>
      <details class="coach-aside" aria-label="带练教练与客户对话"><summary>查看客户对话与本步提示</summary>
        <div class="coach-copy"><span>这一步，先记住</span><p id="coachTip">不用背话术，先跟着做一次。</p></div>
        <div class="customer-top"><span class="customer-avatar">林</span><div><b>客户小林</b><small id="customerStage">完成获客后，她会来咨询</small></div></div>
        <div class="chat" id="chat" role="log" aria-label="模拟客户对话" aria-live="polite"></div>
        <p class="chat-caption">模拟对话，跟着练习更新</p>
      </details>
    </div>
    <footer class="page-footer"><span>猫咪、价格和对话均为模拟资料，不会发送真实消息或产生订单。</span><span id="stepStatus" aria-live="polite">准备开始</span></footer>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <dialog id="resetDialog"><form method="dialog"><span class="dialog-symbol">↻</span><h2>再从头练一次？</h2><p>当前练习进度会清空，我们从第一步重新开始。</p><div class="dialog-actions"><button class="button secondary" value="cancel" autofocus>继续当前练习</button><button class="button primary" value="reset">重新开始</button></div></form></dialog>
